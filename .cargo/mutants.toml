# cargo-mutants project config — see docs/specs/cargo-mutants-policy.md
#
# Note: cargo-mutants v27+ reads this file from .cargo/mutants.toml (not .mutants.toml).
# The story spec named it .mutants.toml but the tool's actual default path is
# .cargo/mutants.toml. Both are equivalent when passed via --config; the .cargo/ location
# is the zero-flags default.

# Scope mutation testing to the bulk + create modules where F6 hardening review
# identified weak-assertion risk.
examine_globs = [
    "src/adf.rs",
    "src/api/jira/bulk.rs",
    "src/types/jira/bulk.rs",
    "src/cli/issue/create.rs",
    "src/api/jsm/requests.rs",
    "src/api/jsm/request_types.rs",
    "src/cli/requesttype.rs",
    # HIGH-value: JRACLOUD-95368 anti-loop guard, seen_keys dedup, has_more sentinel,
    # cursor-vs-offset pagination branch, list_comments (F1 sibling analysis, MAINT-MUTANTS-GLOBS-01).
    "src/api/jira/issues.rs",
    # HIGH-value: TTL logic, per-profile path construction, model-a vs model-b
    # error-handling split (F1 sibling analysis, MAINT-MUTANTS-GLOBS-01).
    "src/cache.rs",
]

# Absolute per-mutant test ceiling (seconds). Overrides timeout_multiplier when
# the multiplier result exceeds this value. The slowest legitimate test in scope
# (tests/bulk_deadline_propagation.rs real wall-clock sleep) runs in ~30–40s;
# 120s is 3× that — generous for runner variance, tight enough to kill hung
# async mutations quickly. Root cause: MUTATION-CI-TIMEOUT / docs/specs/cargo-mutants-policy.md §Timeout Parameters.
minimum_test_timeout = 120

# Multiplier on the measured baseline test duration to derive per-mutant timeout.
# Reduced from 3.0 to 2.0: with the 120s absolute ceiling, the multiplier only
# matters when the baseline is small (< 60s). At ~90s baseline, 2.0× = 180s —
# overridden by the 120s ceiling. Retaining the multiplier preserves the
# baseline-proportional floor for fast-baseline scenarios.
# Root cause: MUTATION-CI-TIMEOUT / docs/specs/cargo-mutants-policy.md §Multiplier Reduction.
timeout_multiplier = 2.0

# Match the CI test invocation so mutation runs use the same feature set as
# the verifying suite.
additional_cargo_test_args = ["--all-features"]
