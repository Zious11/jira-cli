# JUSTIFIED EXCLUSION (S-575-1) — see docs/specs/cargo-mutants-policy.md §Exclusions.
#
# `delete ! in JiraClient::search_issues_with_fields` (the `if !page_has_more { break; }`
# terminal-page guard, src/api/jira/issues.rs) is uncatchable-as-anything-but-TIMEOUT, not
# a coverage gap:
#
#   - Deleting `!` makes the loop NOT break on a terminal page. A terminal page always has
#     `next_page_token == None`, so the JRACLOUD-95368 repeated-cursor anti-loop guard
#     (`next_cursor.is_some() && next_cursor == prev_cursor`) never fires (`is_some()` is
#     false on `None`) — the mutant re-fetches the same terminal page forever.
#   - cargo-mutants runs the WHOLE test binary against each mutant. Any test that reaches a
#     terminal page (which is every realistic pagination test — that's how pagination ends)
#     hangs the process before any assertion can complete, so the run is killed by
#     `--timeout 240` and classified TIMEOUT (= survived), never MISSED or CAUGHT.
#   - Bounding one mock/test can't fix this: EVERY terminal-page test hangs identically —
#     there is no assertion shape that observes the infinite loop before the timeout does.
#   - The break's correctness is positively verified by the multi-page termination tests,
#     e.g. `test_search_issues_with_fields_two_page_pagination_terminates_at_terminal_page`
#     (src/api/jira/issues.rs) and the `rate_limit_cap_tests.rs` pagination-termination set —
#     these assert the loop DOES terminate, which is the property this mutant would break.
#
# Regex is anchored to file:line:col + exact function name so it matches ONLY this one
# mutant — NOT the sibling `delete ! in JiraClient::search_issues` (issues.rs:273, same
# `if !page_has_more { break; }` shape, different function) or `search_issue_keys`, and not
# any of the sibling `>`/`>=`/`||`/`&&`/`==` mutants at nearby lines in the same function.
exclude_re = [
    '^src/api/jira/issues\.rs:374:16: delete ! in JiraClient::search_issues_with_fields$',
    # CR-002 / F-C007-M1 (cycle-007 F5 fix bundle): `probe_matching_kind_credential`
    # was consolidated from two byte-identical per-file copies (formerly in
    # `cli/auth/list.rs` and `cli/auth/status.rs`) into ONE shared implementation in
    # `api/auth.rs`. It reads the OS keychain and has no injection seam — its
    # mutations cannot be caught by DEFAULT-CI tests. `src/api/auth.rs` is not
    # currently in `examine_globs` (see docs/specs/cargo-mutants-policy.md
    # "FIX-F6-1 deferred, not added"), so this pair is presently inert, but is kept
    # so the exclusion travels with the function if/when that file enters scope.
    # TWO regexes are required (mirrors the pre-consolidation per-file pattern):
    #
    # Regex A — operator/expression mutants (e.g. `delete ==`, `replace &&`,
    # `replace .is_ok() with false`):
    #     cargo-mutants names these
    #     "src/api/auth.rs:N:C: <op> in probe_matching_kind_credential"
    # Anchored to file + function suffix. Does NOT match derive_auth_state,
    # collect_probe_results, or any renderer.
    '^src/api/auth\.rs:\d+:\d+: .+ in probe_matching_kind_credential$',
    # Regex B — whole-function-body replacement mutants (e.g.
    #     `replace probe_matching_kind_credential -> bool with true`):
    #     cargo-mutants names these
    #     "src/api/auth.rs:N:C: replace probe_matching_kind_credential … with …"
    #     These do NOT end in "in probe_matching_kind_credential" so Regex A
    #     does not cover them → they would report MISSED (no DEFAULT-CI test
    #     exercises the real keychain probe, by design).
    # Anchored to file + function name; does NOT match derive_auth_state,
    # collect_probe_results, render_list_table, render_list_json, or handle_list.
    '^src/api/auth\.rs:\d+:\d+: replace probe_matching_kind_credential .*$',
    # S-cycle7-auth-status-json B2: `peek_oauth_app_source` in status.rs
    # reads the OS keychain (try_load_oauth_app_credentials + embedded flag)
    # and has no injection seam — mutations cannot be caught by DEFAULT-CI
    # tests. `peek_oauth_app_source_for_test` (pure, no keychain) is NOT
    # excluded. TWO regexes required:
    #
    # Regex A — operator/expression mutants:
    '^src/cli/auth/status\.rs:\d+:\d+: .+ in peek_oauth_app_source$',
    # Regex B — whole-function-body replacement mutants:
    '^src/cli/auth/status\.rs:\d+:\d+: replace peek_oauth_app_source .*$',
    # FIX-F7-001 (closes CYCLE-008-F6-MUTANTS-EXAMINE-GLOBS-GAP): the
    # F-WAVE-1 double-fault fix's `classify_401_body` WIRING sites inside
    # `JiraClient::send_inner`'s post-refresh and reconcile retry paths.
    # `classify_401_body` itself is excluded from nothing (see above) — it
    # is default-CI-testable in isolation. These 5 mutants sit on the
    # *conditions that gate reaching* the two `classify_401_body(...)` call
    # sites (lines ~858 and ~920), which are reachable ONLY through a
    # successful (or reconciled) OAuth token refresh — a path that
    # unconditionally touches the OS keychain twice per
    # tests/oauth_refresh_integration.rs's own module doc (BYO-app-credential
    # lookup before refresh, `store_oauth_tokens` after). Every test that
    # exercises this region — including the one that pins the exact
    # double-fault fix, `test_bc_wave1_expired_and_under_scoped_token_
    # classifies_as_insufficient_scope_not_not_authenticated` — is
    # `#[ignore]`d behind `JR_RUN_KEYRING_TESTS=1`, which default CI never
    # sets. Correctness is positively verified by that keyring-gated test
    # plus the AC-001/AC-004/AC-010 keyring-gated tests in the same file
    # (`test_send_retries_once_after_refresh_on_401`,
    # `test_send_caps_refresh_at_one_attempt_when_retry_also_401`,
    # `test_inter_process_reconcile_after_invalid_grant`), none of which run
    # under default `cargo test`.
    #
    # Anchored to exact file:line:col + `JiraClient::send_inner` so this
    # does NOT widen to the function's other, genuinely default-CI-testable
    # mutants (e.g. the rate-limit retry loop, the pre-refresh
    # `first_401_classified` check, or the Bearer-vs-Basic guard at line
    # ~786), which are exercised by tests/oauth_flow_holdouts.rs,
    # tests/api_client.rs, and tests/rate_limit_cap_tests.rs.
    #
    # 844:21 / 913:25 — the `is_client_error() || is_server_error()` guard
    # entering the primary post-refresh retry's / the reconcile retry's
    # error-handling arm (each gates its sibling classify_401_body call):
    '^src/api/client\.rs:844:21: replace \|\| with && in JiraClient::send_inner$',
    '^src/api/client\.rs:913:25: replace \|\| with && in JiraClient::send_inner$',
    # 846:48 / 915:52 — the `retry_response.status() == StatusCode::
    # UNAUTHORIZED` branch selecting the classify_401_body call itself, in
    # the primary post-refresh retry and the reconcile retry respectively:
    '^src/api/client\.rs:846:48: replace == with != in JiraClient::send_inner$',
    '^src/api/client\.rs:915:52: replace == with != in JiraClient::send_inner$',
    # 883:43 — the AC-010 reconcile-detection comparison
    # (`initial_bearer != self.auth_header`) that decides whether the
    # reconcile retry (and its own classify_401_body call at line ~920) is
    # attempted at all; reading the keychain via `load_oauth_tokens` to
