# cargo-mutants project config — see docs/specs/cargo-mutants-policy.md
#
# Note: cargo-mutants v27+ reads this file from .cargo/mutants.toml (not .mutants.toml).
# The story spec named it .mutants.toml but the tool's actual default path is
# .cargo/mutants.toml. Both are equivalent when passed via --config; the .cargo/ location
# is the zero-flags default.

# Scope mutation testing to adf, bulk/issue-write cluster, issues, cache, and jsm modules.
# Canonical scope definition: docs/specs/cargo-mutants-policy.md §Scope.
examine_globs = [
    "src/adf.rs",
    "src/api/jira/bulk.rs",
    "src/types/jira/bulk.rs",
    "src/cli/issue/create.rs",
    # HIGH-value: handle_edit, handle_edit_bulk_labels, handle_edit_bulk_fields —
    # bulk routing forks, C-1 guard, label endpoint fork, type-change path.
    # Relocated from create.rs by ADR-0012 Seam B (PR #558). ~99 mutants (DEC-149).
    "src/cli/issue/edit.rs",
    # HIGH-value: handle_jsm_create — JSM dispatch, RT-id resolution, scope-hint.
    # Relocated from create.rs by ADR-0012 Seam A (PR #556). ~9 mutants (DEC-149).
    "src/cli/issue/jsm_create.rs",
    # HIGH-value: handle_comment_add — ADF conversion fork (markdown vs plain text),
    # internal flag, stdin/file/positional source resolution.
    # Extracted from workflow.rs by ADR-0012 Seam (S-577-1 / PF-017).
    "src/cli/issue/interactions.rs",
    "src/api/jsm/requests.rs",
    "src/api/jsm/request_types.rs",
    "src/cli/requesttype.rs",
    # HIGH-value: JRACLOUD-95368 anti-loop guard, seen_keys dedup, has_more sentinel,
    # cursor-vs-offset pagination branch, list_comments (F1 sibling analysis, MAINT-MUTANTS-GLOBS-01).
    "src/api/jira/issues.rs",
    # HIGH-value: TTL logic, per-profile path construction, model-a vs model-b
    # error-handling split (F1 sibling analysis, MAINT-MUTANTS-GLOBS-01).
    "src/cache.rs",
]

# Exclude todo!() stubs in interactions.rs that are unkillable by design.
# handle_comment_edit is implemented in a future story (S-577-4/5) and must not
# be mutated until then — a todo!() body produces only one possible mutation
# (replace return with Ok(())) which always panics at runtime, never caught.
# IMPORTANT: remove this exclude_re entry when S-577-4/5 implement the edit stub
# (handle_comment_view was removed here when S-577-6 implemented it).
# Note: #[mutants::skip] attribute (policy §Whitelist Convention) requires the
# `mutants` crate (not in Cargo.toml); comment-based skip does not work in
# cargo-mutants 27.0.0; exclude_re is the supported crate-free alternative.
exclude_re = ["handle_comment_(edit)"]

# The absolute per-mutant test ceiling is set via `--timeout 240` on the CLI
# invocation (CI and local). There is no .cargo/mutants.toml key for it in
# cargo-mutants 27.x — `--timeout` is a CLI-only flag.
# See docs/specs/cargo-mutants-policy.md §Timeout Parameters for derivation.

# Match the CI test invocation so mutation runs use the same feature set as
# the verifying suite.
additional_cargo_test_args = ["--all-features"]
